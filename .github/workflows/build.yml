            bool get _connected => _status.state == 'CONNECTED';
            bool get _connecting => _status.state == 'CONNECTING';

            // هر لینکی به شکل scheme://... که http/https نباشه یک کانفیگ حساب می‌شه
            // (vless، vmess، trojan، ss، ssh، hysteria2، tuic، wireguard و ...)
            static final RegExp _linkRe = RegExp(r'^[A-Za-z][A-Za-z0-9+.\-]*://\S');
            static const _coreSchemes = [
              'vmess://',
              'vless://',
              'trojan://',
              'ss://',
              'socks://',
              'wireguard://',
            ];
            bool _isLink(String s) {
              final l = s.toLowerCase();
              if (l.startsWith('http://') || l.startsWith('https://')) return false;
              return _linkRe.hasMatch(s);
            }

            /// هسته فقط همین پروتکل‌ها رو وصل می‌کنه
            bool _unsupported(Cfg c) {
              if (c.isJson) return false;
              final l = c.link.toLowerCase();
              return !_coreSchemes.any(l.startsWith);
            }

            @override
            void initState() {
              super.initState();
              WidgetsBinding.instance.addObserver(this);
              langPref.addListener(_onLang);
              themePref.addListener(_onLang);
              _v2ray = V2ray(onStatusChanged: _onStatus);
              coreHandle = _v2ray;
              _init();
            }

            void _onLang() {
              if (mounted) setState(() {});
            }

            @override
            void dispose() {
              WidgetsBinding.instance.removeObserver(this);
              langPref.removeListener(_onLang);
              themePref.removeListener(_onLang);
              _pingTimer?.cancel();
              _liveTimer?.cancel();
              _live?.close();
              super.dispose();
            }

            @override
            void didChangeAppLifecycleState(AppLifecycleState state) {
              if (state == AppLifecycleState.resumed) {
                _foreground = true;
                // اتصال قبلی گیر کرده بود؛ با برگشت به برنامه آزاد می‌شه
                if (_retrying &&
                    !_connected &&
                    DateTime.now().difference(_connectAt).inSeconds > 45) {
                  _connSeq++;
                  _retrying = false;
                  if (mounted) setState(() {});
                }
                final idle = !_connected && !_connecting && !_retrying;
                if (S.autoUpdate &&
                    DateTime.now().difference(_lastSubUpdate).inSeconds > 30) {
                  _updateAllSubs(manual: idle);
                } else if (idle) {
                  _pingAll(manual: true, tries: 2);
                }
              } else if (state == AppLifecycleState.paused) {
                _foreground = false;
                _save();
                S.save();
              }
            }

            // ---------- راه‌اندازی ----------

            Future<void> _init() async {
              try {
                await _load();
              } catch (e) {
                _toast(tr('خطا در خواندن کانفیگ‌ها: $e', 'Could not read saved configs: $e'));
              }
              _loaded = true;
              try {
                await _v2ray.initialize();
              } catch (e) {
                _v2rayReady = false; // موقع اتصال دوباره امتحان می‌شه
                _toast('V2Ray: $e');
              }
              // دکمه «قطع اتصال» اعلان
              _notifCh.setMethodCallHandler((call) async {
                if (call.method == 'disconnect') {
                  await _userDisconnect();
                  return true;
                }
                return null;
              });
              try {
                final p = await _notifCh.invokeMethod<bool>('pending');
                if (p == true) {
                  await _userDisconnect();
                  try {
                    await _notifCh.invokeMethod<bool>('moveToBack');
                  } catch (_) {}
                }
              } catch (_) {}
              // با ورود به برنامه هیچ اتصالی خودکار برقرار نمی‌شه؛ فقط خود کاربر وصل و قطع می‌کنه
              // پینگ کانفیگ‌های ذخیره‌شده فوراً شروع می‌شه و منتظر دانلود ساب نمی‌مونه
              final crashed = await _coreCrashCheck();
              if (crashed) {
                _toast(tr('دفعه قبل وسط تست یه کانفیگ برنامه بسته شد؛ پینگ خودکار این بار خاموش شد',
                    'The app closed during a config test last time, so auto ping is skipped this time'));
              } else {
                _pingAll(manual: true, tries: 2);
              }
              if (_subs.isNotEmpty && S.autoUpdate) {
                await _updateAllSubs(); // اگه کانفیگ‌ها عوض شده باشن دوباره پینگ می‌گیره
              }

              _pingTimer = Timer.periodic(const Duration(seconds: 5), (_) {
                // وقتی وصل هستیم یا داریم وصل می‌شیم پینگ پس‌زمینه نمی‌گیریم تا اتصال لگ نکنه
                // (پینگ زنده از داخل تونل جدا گرفته می‌شه)
                unawaited(_reconnectTick());
                if (!_foreground || _probing || _updatingSubs || _connected || _connecting || _retrying) return;
                _pingTick++;
                if (_pingTick % 12 == 0) {
                  // هر یک دقیقه همه کانفیگ‌ها
                  _pingAll();
                } else {
                  // هر ۵ ثانیه فقط کانفیگ انتخاب‌شده
                  final a = _byLink(_selected);
                  if (a != null) _pingConfigs([a]);
                }
              });
              _liveTimer = Timer.periodic(const Duration(seconds: 5), (_) => _liveTick());
            }

            Future<File?> _backupFile() async {
              try {
                final d = await getApplicationSupportDirectory();
                return File('${d.path}/erfan_backup.json');
              } catch (_) {
                return null;
              }
            }

            Future<void> _writeBackup() async {
              try {
                final f = await _backupFile();
                if (f == null) return;
                final data = jsonEncode({
                  'configs': _configs.map((e) => e.toJson()).toList(),
                  'subs': _subs,
                  'selected': _selected,
                  'custom': _custom,
                });
                final tmp = File('${f.path}.tmp');
                await tmp.writeAsString(data, flush: true);
                await tmp.rename(f.path);
              } catch (_) {}
            }

            Future<Map<String, dynamic>?> _readBackup() async {
              try {
                final f = await _backupFile();
                if (f == null || !await f.exists()) return null;
                final m = jsonDecode(await f.readAsString());
                return m is Map ? Map<String, dynamic>.from(m) : null;
              } catch (_) {
                return null;
              }
            }

            Future<void> _load() async {
              final p = await SharedPreferences.getInstance();
              List<Cfg> list = [];
              final raw = p.getString('configs') ?? p.getString('configs_bak');
              if (raw != null) {
                try {
                  list = (jsonDecode(raw) as List)
                      .map((e) => Cfg.fromJson(e as Map<String, dynamic>))
                      .toList();
                } catch (_) {}
              }
              final infoRaw = p.getString('subinfo');
              if (infoRaw != null) {
                try {
                  final m = jsonDecode(infoRaw) as Map<String, dynamic>;
                  m.forEach((k, v) {
                    _subInfo[k] = SubInfo.fromJson(Map<String, dynamic>.from(v as Map));
                  });
                } catch (_) {}
              }
              final spRaw = p.getString('speeds');
              if (spRaw != null) {
                try {
                  final m = jsonDecode(spRaw) as Map<String, dynamic>;
                  m.forEach((k, v) {
                    final mm = Map<String, dynamic>.from(v as Map);
                    _speeds[k] = (mm['s'] as num).toDouble();
                    final u = mm['u'];
                    if (u is num && u > 0) _ups[k] = u.toDouble();
                    _speedAt[k] = (mm['t'] as num).toInt();
                  });
                } catch (_) {}
              }
              final custRaw = p.getString('custom');
              if (custRaw != null) {
                try {
                  final m = jsonDecode(custRaw) as Map<String, dynamic>;
                  m.forEach((k, v) => _custom[k] = v.toString());
                } catch (_) {}
              }
              final pgRaw = p.getString('pings');
              if (pgRaw != null) {
                try {
                  final m = jsonDecode(pgRaw) as Map<String, dynamic>;
                  m.forEach((k, v) {
                    if (v is num && v > 0) _pings[k] = v.toInt();
                  });
                } catch (_) {}
              }
              final stRaw = p.getString('strat2');
              if (stRaw != null) {
                try {
                  final m = jsonDecode(stRaw) as Map<String, dynamic>;
                  m.forEach((k, v) {
                    if (v is num) _strat[k] = v.toInt();
                  });
                } catch (_) {}
              }
              String src = 'prefs';
              List<String> subsList = p.getStringList('subs') ?? [];
              String? selected = p.getString('selected');
              if (list.isEmpty) {
                final b = await _readBackup();
                if (b != null && b['configs'] is List && (b['configs'] as List).isNotEmpty) {
                  try {
                    list = (b['configs'] as List)
                        .map((e) => Cfg.fromJson(Map<String, dynamic>.from(e as Map)))
                        .toList();
                    subsList = List<String>.from((b['subs'] as List?) ?? const []);
                    selected = b['selected'] as String?;
                    if (b['custom'] is Map) {
                      (b['custom'] as Map).forEach((k, v) => _custom[k.toString()] = v.toString());
                    }
                    src = 'file';
                  } catch (_) {}
                } else {
                  src = 'none';
                }
              }
              _loadInfo = '${list.length} • $src';
              if (!mounted) return;
              setState(() {
                _configs = list;
                _subs = subsList;
                _selected = selected;
                _sort = p.getInt('sort2') ?? 0;
           _picked = p.getBool('picked') ?? false;
                _resort();
              });
            }

            Future<void> _save() async {
              if (!_loaded) return;
              final p = await SharedPreferences.getInstance();
              // لیست خالی فقط وقتی ذخیره می‌شه که خود کاربر حذف کرده باشه
              if (_configs.isNotEmpty || _allowEmpty) {
                _saveInfo = '${_configs.length} • ${DateTime.now().toString().substring(11, 19)}';
                await _writeBackup();
                final cj = jsonEncode(_configs.map((e) => e.toJson()).toList());
                await p.setString('configs', cj);
                await p.setString('configs_bak', cj);
              }
              await p.setStringList('subs', _subs);
              await p.setString('subinfo',
                  jsonEncode(_subInfo.map((k, v) => MapEntry(k, v.toJson()))));
              await p.setString('custom', jsonEncode(_custom));
              await p.setString('strat2', jsonEncode(_strat));
              await p.setString('pings', jsonEncode({
                for (final e in _pings.entries)
                  if (e.value > 0) e.key: e.value
              }));
              await p.setInt('sort2', _sort);
              await p.setBool('picked', _picked);
              await p.setString(
                  'speeds',
                  jsonEncode({
                    for (final e in _speeds.entries)
                      e.key: {'s': e.value, 't': _speedAt[e.key] ?? 0, 'u': _ups[e.key] ?? 0}
                  }));
              if (_selected != null) {
                await p.setString('selected', _selected!);
              } else {
                await p.remove('selected');
              }
            }

            void _toast(String msg) {
              if (!mounted) return;
              ScaffoldMessenger.of(context)
                ..hideCurrentSnackBar()
                ..showSnackBar(SnackBar(content: Text(msg)));
            }

            // ---------- کمک‌ها ----------

            String _nameOf(Cfg c) {
              final cu = _custom[c.link];
              if (cu != null && cu.isNotEmpty) return cu;
              return _names.putIfAbsent(c.link, () {
                if (c.isJson) {
                  try {
                    final j = jsonDecode(c.link);
                    if (j is Map && j['remarks'] != null) return j['remarks'].toString();
                  } catch (_) {}
                  return 'JSON';
                }
                if (c.link.toLowerCase().startsWith('wireguard://')) {
                  final h = c.link.indexOf('#');
                  if (h >= 0 && h < c.link.length - 1) {
                    try {
                      return Uri.decodeComponent(c.link.substring(h + 1));
                    } catch (_) {}
                  }
                  return 'WireGuard';
                }
                try {
                  final r = V2ray.parseFromURL(c.link).remark;
                  return r.isEmpty ? '—' : r;
                } catch (_) {
                  final h = c.link.indexOf('#');
                  if (h >= 0 && h < c.link.length - 1) {
                    try {
                      return Uri.decodeComponent(c.link.substring(h + 1));
                    } catch (_) {}
                  }
                  return '—';
                }
              });
            }

            String _rawHost(Cfg c) {
              try {
                if (c.isJson) {
                  final j = jsonDecode(c.link);
                  if (j is Map) {
                    final ob = j['outbounds'];
                    if (ob is List && ob.isNotEmpty) {
                      final s = ob[0]['settings'];
                      if (s is Map) {
                        final v = s['vnext'];
                        if (v is List && v.isNotEmpty) {
                          return (v[0]['address'] ?? '').toString();
                        }
                        final sv = s['servers'];
                        if (sv is List && sv.isNotEmpty) {
                          return (sv[0]['address'] ?? '').toString();
                        }
                        final pe = s['peers'];
                        if (pe is List && pe.isNotEmpty) {
                          final ep = (pe[0]['endpoint'] ?? '').toString();
                          if (ep.startsWith('[')) {
                            final e = ep.indexOf(']');
                            return e > 1 ? ep.substring(1, e) : '';
                          }
                          final i = ep.lastIndexOf(':');
                          return i > 0 ? ep.substring(0, i) : ep;
                        }
                      }
                    }
                  }
                  return '';
                }
                if (c.link.startsWith('vmess://')) {
                  final raw = c.link.substring(8).split('#').first;
                  final j = jsonDecode(utf8.decode(base64.decode(base64.normalize(raw))));
                  return (j['add'] ?? '').toString();
                }
                if (c.link.startsWith('ss://')) {
                  final u = Uri.tryParse(c.link);
                  if (u != null && u.host.isNotEmpty) return u.host;
                  final body = c.link.substring(5).split('#').first;
                  final dec = utf8.decode(base64.decode(base64.normalize(body)));
                  final at = dec.lastIndexOf('@');
                  if (at >= 0) return dec.substring(at + 1).split(':').first;
                  return '';
                }
                return Uri.tryParse(c.link)?.host ?? '';
              } catch (_) {
                return '';
              }
            }

            String _hostOf(Cfg c) => _hosts.putIfAbsent(c.link, () {
                  final h = _rawHost(c);
                  if (h.length <= 8) return h;
                  return '${h.substring(0, 4)}****${h.substring(h.length - 4)}';
                });

            String _fullConfig(Cfg c) {
              if (c.isJson) return c.link;
              if (c.link.toLowerCase().startsWith('wireguard://')) {
                final m = _wgFromLink(c.link);
                if (m == null) throw const FormatException('invalid wireguard link');
                return jsonEncode(m);
              }
              return V2ray.parseFromURL(c.link).getFullConfiguration();
            }

            // ---------- WireGuard ----------

            /// کانفیگ کامل xray با خروجی wireguard (ورودی‌ها مثل بقیه کانفیگ‌ها socks:10808 و http:10809)
            Map<String, dynamic> _wgConfig({
              required String secretKey,
              required List<String> address,
              required List<Map<String, dynamic>> peers,
              int? mtu,
              List<int>? reserved,
              List<String>? dns,
              String remark = 'WireGuard',
            }) {
              Map<String, dynamic> sniff() => {
                    'enabled': true,
                    'destOverride': ['http', 'tls'],
                    'routeOnly': false,
                  };
              return {
                'remarks': remark,
                'log': {'loglevel': 'warning'},
                'inbounds': [
                  {
                    'tag': 'socks',
                    'port': 10808,
                    'listen': '127.0.0.1',
                    'protocol': 'socks',
                    'sniffing': sniff(),
                    'settings': {'auth': 'noauth', 'udp': true, 'allowTransparent': false},
                  },
                  {
                    'tag': 'http',
                    'port': 10809,
                    'listen': '127.0.0.1',
                    'protocol': 'http',
                    'sniffing': sniff(),
                    'settings': {'auth': 'noauth', 'udp': false, 'allowTransparent': false},
                  },
                ],
                'outbounds': [
                  {
                    'tag': 'proxy',
                    'protocol': 'wireguard',
                    'settings': {
                      'secretKey': secretKey,
                      'address': address,
                      'peers': [
                        for (final p in peers)
                          {
                            'allowedIPs': ['0.0.0.0/0', '::/0'],
                            'keepAlive': 15, // بدون keepalive، NAT شبکه موبایل بعد از مدتی بی‌کاری اتصال رو می‌بنده
                            ...p,
                          }
                      ],
                      'mtu': mtu ?? 1280,
                      if (reserved != null && reserved.length == 3) 'reserved': reserved,
                    },
                  },
                  {'tag': 'direct', 'protocol': 'freedom', 'settings': {}},
                  {'tag': 'block', 'protocol': 'blackhole', 'settings': {}},
                ],
                'dns': {
                  'servers': [
                    ...?dns,
                    if (!(dns ?? const []).contains('1.1.1.1')) '1.1.1.1',
                    if (!(dns ?? const []).contains('8.8.8.8')) '8.8.8.8',
                  ]
                },
                'routing': {'domainStrategy': 'IPIfNonMatch', 'rules': []},
              };
            }

            List<int>? _wgReserved(String? v) {
              if (v == null || v.trim().isEmpty) return null;
              final p = v.split(RegExp(r'[,\s]+')).where((e) => e.isNotEmpty).toList();
              if (p.length != 3) return null;
              final r = p.map(int.tryParse).toList();
              if (r.any((e) => e == null || e < 0 || e > 255)) return null;
              return r.cast<int>();
            }

            String _wgEndpoint(String host, int port) =>
                host.contains(':') ? '[$host]:$port' : '$host:$port';

            /// wireguard://PRIVATEKEY@host:port?address=..&publickey=..&mtu=..&reserved=1,2,3#name
            Map<String, dynamic>? _wgFromLink(String link) {
              try {
                final u = Uri.parse(link.trim());
                // در base64 علامت + ممکنه در آدرس به فاصله تبدیل شده باشه
                String fix(String? v) => (v ?? '').trim().replaceAll(' ', '+');
                final q = <String, String>{
                  for (final e in u.queryParameters.entries) e.key.toLowerCase(): e.value,
                };
                final secret = fix(Uri.decodeComponent(u.userInfo));
                final pub = fix(q['publickey']);
                final host = u.host;
                if (secret.isEmpty || pub.isEmpty || host.isEmpty) return null;
                final addr = (q['address'] ?? q['ip'] ?? '')
                    .split(',')
                    .map((e) => e.trim())
                    .where((e) => e.isNotEmpty)
                    .toList();
                if (addr.isEmpty) return null;
                final psk = fix(q['presharedkey'] ?? q['psk']);
                final ka = int.tryParse(q['keepalive'] ?? q['persistentkeepalive'] ?? '');
                String remark = 'WireGuard';
                if (u.fragment.isNotEmpty) {
                  try {
                    remark = Uri.decodeComponent(u.fragment);
                  } catch (_) {}
                }
                return _wgConfig(
                  secretKey: secret,
                  address: addr,
                  peers: [
                    {
                      'publicKey': pub,
                      if (psk.isNotEmpty) 'preSharedKey': psk,
                      'endpoint': _wgEndpoint(host, u.hasPort ? u.port : 51820),
                      if (ka != null) 'keepAlive': ka,
                    }
                  ],
                  mtu: int.tryParse(q['mtu'] ?? ''),
                  reserved: _wgReserved(q['reserved']),
                  remark: remark,
                );
              } catch (_) {
                return null;
              }
            }

            bool _looksLikeWgConf(String t) =>
                RegExp(r'^\s*\[Interface\]', caseSensitive: false, multiLine: true).hasMatch(t) &&
                RegExp(r'^\s*\[Peer\]', caseSensitive: false, multiLine: true).hasMatch(t);

            /// فایل/متن استاندارد WireGuard (.conf) با بخش‌های [Interface] و [Peer]
            Map<String, dynamic>? _wgFromConf(String text) {
              try {
                String sec = '';
                String remark = '';
                final iface = <String, String>{};
                final peers = <Map<String, String>>[];
                for (final raw in text.split(RegExp(r'\r?\n'))) {
                  final line = raw.trim();
                  if (line.isEmpty) continue;
                  if (line.startsWith('#') || line.startsWith(';')) {
                    final cm = line.substring(1).trim();
                    if (remark.isEmpty && cm.isNotEmpty && cm.length <= 40) remark = cm;
                    continue;
                  }
                  if (line.startsWith('[')) {
                    sec = line.toLowerCase();
                    if (sec == '[peer]') peers.add(<String, String>{});
                    continue;
                  }
                  final i = line.indexOf('=');
                  if (i <= 0) continue;
                  final k = line.substring(0, i).trim().toLowerCase();
                  final v = line.substring(i + 1).trim();
                  if (sec == '[interface]') {
                    iface[k] = v;
                  } else if (sec == '[peer]' && peers.isNotEmpty) {
                    peers.last[k] = v;
                  }
                }
                final secret = iface['privatekey'] ?? '';
                final addr = (iface['address'] ?? '')
                    .split(',')
                    .map((e) => e.trim())
                    .where((e) => e.isNotEmpty)
                    .toList();
                if (secret.isEmpty || addr.isEmpty || peers.isEmpty) return null;
                final outPeers = <Map<String, dynamic>>[];
                for (final p in peers) {
                  final pub = p['publickey'] ?? '';
                  final ep = p['endpoint'] ?? '';
                  if (pub.isEmpty || ep.isEmpty) continue;
                  final ka = int.tryParse(p['persistentkeepalive'] ?? '');
                  final psk = p['presharedkey'] ?? '';
                  outPeers.add({
                    'publicKey': pub,
                    if (psk.isNotEmpty) 'preSharedKey': psk,
                    'endpoint': ep,
                    if (ka != null && ka > 0) 'keepAlive': ka,
                  });
                }
                if (outPeers.isEmpty) return null;
                if (remark.isEmpty) {
                  final ep = outPeers.first['endpoint'].toString();
                  remark = 'WG ${ep.split(':').first.replaceAll('[', '')}';
                }
                return _wgConfig(
                  secretKey: secret,
                  address: addr,
                  peers: outPeers,
                  mtu: int.tryParse(iface['mtu'] ?? ''),
                  reserved: _wgReserved(iface['reserved'] ?? peers.first['reserved']),
                  dns: (iface['dns'] ?? '')
                      .split(',')
                      .map((e) => e.trim())
                      .where((e) => InternetAddress.tryParse(e) != null)
                      .toList(),
                  remark: remark,
                );
              } catch (_) {
                return null;
              }
            }

            /// کانفیگ نهایی؛ اگه تنظیمات DNS و مسیر دست‌نخورده باشن، کانفیگ اصلی برمی‌گرده.
            String _buildConfig(Cfg c, {int? strat}) {
              final base = _fullConfig(c);
              final st = strat ?? _strat[c.link] ?? (S.fragment ? 2 : 0);
              final needsDns = !c.isJson && S.dnsPreset != 'default';
              final needsRoute = S.domainStrategy != 'default' ||
                  S.bypassIr ||
                  S.directDomains.trim().isNotEmpty ||
                  S.blockDomains.trim().isNotEmpty;
              if (!needsDns && !needsRoute && !S.perf && st == 0) return base;
              try {
                final decoded = jsonDecode(base);
                if (decoded is! Map) return base;
                final m = Map<String, dynamic>.from(decoded);
                try {
                  _tune(m, st);
                } catch (_) {}
                if (needsDns) {
                  final servers = S.dnsServers();
                  if (servers.isNotEmpty) {
                    m['dns'] = {'servers': servers, if (S.perf) 'queryStrategy': 'UseIPv4'};
                  }
                }
                if (needsRoute) {
                  final outs = (m['outbounds'] is List)
                      ? List<dynamic>.from(m['outbounds'] as List)
                      : <dynamic>[];
                  bool hasTag(String t) => outs.any((o) => o is Map && o['tag'] == t);
                  final routing = (m['routing'] is Map)
                      ? Map<String, dynamic>.from(m['routing'] as Map)
                      : <String, dynamic>{};
                  final rules = (routing['rules'] is List)
                      ? List<dynamic>.from(routing['rules'] as List)
                      : <dynamic>[];
                  final front = <dynamic>[];
                  final direct = <String>[
                    ...S.listOf(S.directDomains).map((d) => 'domain:$d'),
                    if (S.bypassIr) 'domain:ir',
                  ];
                  final block = S.listOf(S.blockDomains).map((d) => 'domain:$d').toList();
                  if (direct.isNotEmpty) {
                    if (!hasTag('direct')) {
                      outs.add({'protocol': 'freedom', 'tag': 'direct', 'settings': {}});
                    }
                    front.add(
                        {'type': 'field', 'domain': direct, 'outboundTag': 'direct'});
                  }
                  if (block.isNotEmpty) {
                    if (!hasTag('block')) {
                      outs.add({'protocol': 'blackhole', 'tag': 'block', 'settings': {}});
                    }
                    front
                        .add({'type': 'field', 'domain': block, 'outboundTag': 'block'});
                  }
                  routing['rules'] = [...front, ...rules];
                  if (S.domainStrategy != 'default') {
                    routing['domainStrategy'] = S.domainStrategy;
                  }
                  m['routing'] = routing;
                  m['outbounds'] = outs;
                }
                return jsonEncode(m);
              } catch (_) {
                return base;
              }
            }

              /// تنظیمات بهترین عملکرد برای نت ضعیف و کانفیگ‌های ضعیف
            void _tune(Map<String, dynamic> m, int strat) {
              const proxies = ['vmess', 'vless', 'trojan', 'shadowsocks'];
              final outsRaw = m['outbounds'];
              if (outsRaw is! List) return;
              final outs = List<dynamic>.from(outsRaw);

              if (S.perf) {
                // زمان‌بندی‌ها: اتصال کند زود رها نشه، اتصال مرده زود پاک بشه
                final policy = (m['policy'] is Map)
                    ? Map<String, dynamic>.from(m['policy'] as Map)
                    : <String, dynamic>{};
                final levels = (policy['levels'] is Map)
                    ? Map<String, dynamic>.from(policy['levels'] as Map)
                    : <String, dynamic>{};
                final l0 = (levels['0'] is Map)
                    ? Map<String, dynamic>.from(levels['0'] as Map)
                    : <String, dynamic>{};
                l0['handshake'] = 10;
                l0['connIdle'] = 300;
                l0['uplinkOnly'] = 2;
                l0['downlinkOnly'] = 5;
                levels['0'] = l0;
                policy['levels'] = levels;
                m['policy'] = policy;
                final dnsRaw = m['dns'];
                if (dnsRaw is Map && dnsRaw['queryStrategy'] == null) {
                  m['dns'] = {...Map<String, dynamic>.from(dnsRaw), 'queryStrategy': 'UseIPv4'};
                }
              }

              for (int i = 0; i < outs.length; i++) {
                final o = outs[i];
                if (o is! Map) continue;
                final proto = (o['protocol'] ?? '').toString();
                if (!proxies.contains(proto)) continue;
                final om = Map<String, dynamic>.from(o);
                final ss = (om['streamSettings'] is Map)
                    ? Map<String, dynamic>.from(om['streamSettings'] as Map)
                    : <String, dynamic>{};
                final net = (ss['network'] ?? 'tcp').toString();
                final sec = (ss['security'] ?? 'none').toString();
                final sock = (ss['sockopt'] is Map)
                    ? Map<String, dynamic>.from(ss['sockopt'] as Map)
                    : <String, dynamic>{};

                final fragOk = (strat == 2 || strat == 3) &&
                    sec == 'tls' &&
                    (net == 'tcp' || net == 'ws' || net == 'grpc' || net == 'httpupgrade') &&
                    sock['dialerProxy'] == null;

                if (strat >= 1) sock['domainStrategy'] ??= 'UseIPv4';
                if (S.perf) {
                  sock['tcpKeepAliveIdle'] ??= 30;
                  sock['tcpKeepAliveInterval'] ??= 15;
                  sock['tcpNoDelay'] ??= true;
                }

                if (fragOk) {
                  sock['dialerProxy'] = 'fragment';
                  if (!outs.any((e) => e is Map && e['tag'] == 'fragment')) {
                    outs.add({
                      'tag': 'fragment',
                      'protocol': 'freedom',
                      'settings': {
                        'fragment': {
                          'packets': 'tlshello',
                          'length': strat == 3 ? '10-30' : '100-200',
                          'interval': '10-20',
                        },
                      },
                      'streamSettings': {
                        'sockopt': {'tcpNoDelay': true},
                      },
                    });
                  }
                }

                if (sock.isNotEmpty) ss['sockopt'] = sock;
                if (ss.isNotEmpty) om['streamSettings'] = ss;
                outs[i] = om;
              }
              m['outbounds'] = outs;
            }

            Cfg? _byLink(String? link) {
              if (link == null) return null;
              for (final c in _configs) {
                if (c.link == link) return c;
              }
              return null;
            }

            String _subTitle(String url) {
              final n = _subInfo[url]?.name ?? '';
              if (n.isNotEmpty) return n;
              return Uri.tryParse(url)?.host ?? url;
            }

            /// مرتب‌سازی و ساخت ردیف‌های لیست (فقط آخر هر دور پینگ و موقع تغییر لیست)
            void _resort() {
              try {
                _resortImpl();
              } catch (_) {
                _rows = [
                  CfgGroup(null, 'Local', _configs.where((c) => c.sub == null).toList()),
                  for (final s in _subs)
                    CfgGroup(s, _subTitle(s), _configs.where((c) => c.sub == s).toList()),
                ];
              }
            }

            void _resortImpl() {
              // وایرگارد هیچ پینگی ندارد؛ پینگ‌های قدیمی ذخیره‌شده‌اش هم پاک می‌شود
              for (final c in _configs) {
                if (_isWg(c)) _pings.remove(c.link);
              }
              final idx = <String, int>{
                for (int i = 0; i < _configs.length; i++) _configs[i].link: i,
              };
              int rank(Cfg c) {
                if (_isWg(c)) return 1;
                final p = _pings[c.link];
                if (p == null) return 1;
                if (p < 0) return 2;
                return 0;
              }

              int cmp(Cfg a, Cfg b) {
                if (_sort == 3) return idx[a.link]!.compareTo(idx[b.link]!);
                if (_sort == 2) {
                  final d = _nameOf(a).toLowerCase().compareTo(_nameOf(b).toLowerCase());
                  if (d != 0) return d;
                  return idx[a.link]!.compareTo(idx[b.link]!);
                }
                final ra = rank(a), rb = rank(b);
                if (ra != rb) return ra - rb;
                if (ra == 1) {
                  // بدون پینگ (از جمله وایرگارد): فقط بر اساس سرعت
                  final sd = (_speeds[b.link] ?? 0).compareTo(_speeds[a.link] ?? 0);
                  if (sd != 0) return sd;
                }
                if (ra == 0) {
                  final d = _sort == 0
                      ? _cmpBest(a, b)
                      : _pings[a.link]!.compareTo(_pings[b.link]!);
                  if (d != 0) return d;
                }
                return idx[a.link]!.compareTo(idx[b.link]!);
              }

              final rows = <Object>[];
              final local = _configs.where((c) => c.sub == null).toList()..sort(cmp);
              rows.add(CfgGroup(null, 'Local', local));
              if (!_collapsed.contains('')) rows.addAll(local);
              for (final s in _subs) {
                final items = _configs.where((c) => c.sub == s).toList()..sort(cmp);
                rows.add(CfgGroup(s, _subTitle(s), items));
                if (!_collapsed.contains(s)) rows.addAll(items);
              }
              _rows = rows;
            }

            String? _bestLink() {
              Cfg? best;
              for (final c in _configs) {
                final p = _pings[c.link];
                if (p == null || p <= 0) continue;
                if (best == null || _cmpBest(c, best) < 0) best = c;
              }
              return best?.link;
            }

            // ---------- افزودن ----------

            /// نویسه‌های نامرئی و فاصله‌های اضافه رو پاک می‌کنه
            String _cleanInput(String s) =>
                s.replaceAll(RegExp('[\u200B-\u200F\u2028-\u202F\uFEFF]'), '').trim();

            /// متن base64 (معمولی یا url-safe) رو اگه داخلش کانفیگ بود باز می‌کنه
            String? _tryBase64(String t) {
              final c = t.replaceAll(RegExp(r'\s+'), '');
              if (c.length < 16 || !RegExp(r'^[A-Za-z0-9+/_\-]+=*$').hasMatch(c)) return null;
              try {
                final n = base64.normalize(c.replaceAll('-', '+').replaceAll('_', '/'));
                final d = utf8.decode(base64.decode(n)).trim();
                if (d.contains('://') || d.startsWith('{') || _looksLikeWgConf(d)) return d;
              } catch (_) {}
              return null;
            }

            /// هر نوع ورودی (QR، کلیپ‌بورد، فایل): لینک، چند لینک، JSON، آرایه JSON،
            /// فایل WireGuard، لینک ساب، base64 و لینک‌های اشتراک‌گذاری برنامه‌ها
            Future<void> _handleInput(String input, {int depth = 0}) async {
              var text = _cleanInput(input);
              if (text.isEmpty) return _toast(tr('چیزی پیدا نشد', 'Nothing found'));

              // متنی که URL-encode شده
              if (!text.contains('://') && text.contains('%3A%2F%2F')) {
                try {
                  text = Uri.decodeFull(text).trim();
                } catch (_) {}
              }

              // لینک اشتراک‌گذاری برنامه‌ها: v2rayng://install-config?url=https://...
              if (!text.startsWith('{') && !text.startsWith('[')) {
                final u = Uri.tryParse(text.split(RegExp(r'\s')).first);
                if (u != null && u.hasScheme && !_coreSchemes.any((x) => text.toLowerCase().startsWith(x))) {
                  final low = u.scheme.toLowerCase();
                  final q = u.queryParameters['url'];
                  if (low != 'http' && low != 'https' && q != null && q.toLowerCase().startsWith('http')) {
                    return _handleInput(q, depth: depth + 1);
                  }
                }
              }

              if (text.startsWith('{')) {
                try {
                  final j = jsonDecode(text);
                  if (j is Map && j['outbounds'] is List) {
                    _addManual([text]);
                  } else {
                    _toast(tr('این JSON کانفیگ Xray نیست (outbounds نداره)',
                        'This JSON is not an Xray config (no outbounds)'));
                  }
                } catch (_) {
                  _toast(tr('JSON معتبر نیست', 'Invalid JSON'));
                }
                return;
              }

              if (_looksLikeWgConf(text)) {
                final m = _wgFromConf(text);
                if (m == null) {
                  _toast(tr('کانفیگ WireGuard ناقصه (کلید، آدرس یا Endpoint نیست)',
                      'Incomplete WireGuard config (key, address or endpoint missing)'));
                } else {
                  _addManual([jsonEncode(m)]);
                }
                return;
              }

              // آرایه‌ای از کانفیگ‌های JSON
              if (text.startsWith('[')) {
                try {
                  final j = jsonDecode(text);
                  if (j is List) {
                    final items = <String>[];
                    for (final e in j) {
                      if (e is Map && e['outbounds'] is List) items.add(jsonEncode(e));
                      if (e is String && _isLink(e)) items.add(e.trim());
                    }
                    if (items.isNotEmpty) {
                      _addManual(items);
                      return;
                    }
                  }
                } catch (_) {}
              }

              final links = text.split(RegExp(r'[\r\n\s]+')).where(_isLink).toList();
              if (links.isNotEmpty) {
                _addManual(links);
                return;
              }

              if (text.startsWith('http://') || text.startsWith('https://')) {
                if (!_subs.contains(text)) _subs.add(text);
                await _save();
                await _updateOneSub(text);
                return;
              }

              // متن base64 که داخلش کانفیگ یا لیست کانفیگ‌هاست
              if (depth < 2) {
                final d = _tryBase64(text);
                if (d != null && d != text) return _handleInput(d, depth: depth + 1);
              }
              _toast(tr('کانفیگ یا ساب معتبر نیست', 'Not a valid config or subscription'));
            }

            void _addManual(List<String> links) {
              int added = 0;
              final fresh = <Cfg>[];
              for (final l in links) {
                if (!_configs.any((c) => c.link == l)) {
                  final nc = Cfg(l, null);
                  _configs.add(nc);
                  fresh.add(nc);
                  added++;
                }
              }
              _selected ??= _configs.isNotEmpty ? _configs.first.link : null;
              _resort();
              setState(() {});
              _save();
              _toast(tr('$added کانفیگ اضافه شد', '$added config(s) added'));
              if (fresh.isNotEmpty) _pingConfigs(fresh, manual: true, tries: 2);
            }

