          class PowerButton extends StatefulWidget {
            final Color color;
            final bool connected;
            final bool connecting;
            final VoidCallback onTap;
            const PowerButton({
              super.key,
              required this.color,
              required this.connected,
              required this.connecting,
              required this.onTap,
            });

            @override
            State<PowerButton> createState() => _PowerButtonState();
          }

          class _PowerButtonState extends State<PowerButton> with SingleTickerProviderStateMixin {
            late final AnimationController _c;

            @override
            void initState() {
              super.initState();
              _c = AnimationController(vsync: this, duration: const Duration(milliseconds: 2600));
              _sync();
            }

            @override
            void didUpdateWidget(covariant PowerButton old) {
              super.didUpdateWidget(old);
              _sync();
            }

            // انیمیشن فقط وقتی وصل یا در حال اتصال هستیم اجرا می‌شه (صرفه‌جویی باتری)
            void _sync() {
              if (widget.connected || widget.connecting) {
                if (!_c.isAnimating) _c.repeat();
              } else {
                _c.stop();
                _c.value = 0;
              }
            }

            @override
            void dispose() {
              _c.dispose();
              super.dispose();
            }

            Widget _ring(double p, Color color) => Container(
                  width: 200 + 64 * p,
                  height: 200 + 64 * p,
                  decoration: BoxDecoration(
                    shape: BoxShape.circle,
                    border: Border.all(color: color.withOpacity((1 - p) * 0.45), width: 2),
                  ),
                );

            @override
            Widget build(BuildContext context) {
              final color = widget.color;
              final on = widget.connected;
              return GestureDetector(
                onTap: widget.onTap,
                child: SizedBox(
                  width: 264,
                  height: 264,
                  child: AnimatedBuilder(
                    animation: _c,
                    builder: (context, _) {
                      final t = _c.value;
                      final pulse = math.sin(t * 2 * math.pi) * 0.5 + 0.5;
                      return Stack(
                        alignment: Alignment.center,
                        children: [
                          if (on || widget.connecting) ...[
                            _ring(t, color),
                            _ring((t + 0.5) % 1.0, color),
                          ],
                          Container(
                            width: 246,
                            height: 246,
                            decoration: BoxDecoration(
                              shape: BoxShape.circle,
                              border: Border.all(color: color.withOpacity(0.22), width: 1.5),
                            ),
                          ),
                          Container(
                            width: 218,
                            height: 218,
                            decoration: BoxDecoration(
                              shape: BoxShape.circle,
                              gradient: RadialGradient(
                                colors: [color.withOpacity(on ? 0.18 : 0.08), Colors.transparent],
                              ),
                            ),
                          ),
                          Container(
                            width: 200,
                            height: 200,
                            decoration: BoxDecoration(
                              shape: BoxShape.circle,
                              color: cBtnFill,
                              border: Border.all(color: color, width: 9),
                              boxShadow: [
                                BoxShadow(
                                  color: color.withOpacity(on ? 0.55 + 0.25 * pulse : 0.3),
                                  blurRadius: on ? 30 + 18 * pulse : 18,
                                  spreadRadius: on ? 3 : 0,
                                ),
                              ],
                            ),
                          ),
                          Container(
                            width: 146,
                            height: 146,
                            decoration: BoxDecoration(
                              shape: BoxShape.circle,
                              gradient: RadialGradient(
                                colors: [Color.alphaBlend(color.withOpacity(on ? 0.16 : 0.05), cBtnIn), cBtnIn],
                              ),
                              border: Border.all(color: cBtnInLine, width: 2),
                            ),
                          ),
                          Icon(Icons.power_settings_new, size: 84, color: color),
                          if (widget.connecting)
                            SizedBox(
                              width: 224,
                              height: 224,
                              child: CircularProgressIndicator(strokeWidth: 3, color: color),
                            ),
                        ],
                      );
                    },
                  ),
                ),
              );
            }
          }

          class SparkPainter extends CustomPainter {
            final List<double> v;
            final Color color;
            SparkPainter(this.v, this.color);

            @override
            void paint(Canvas canvas, Size s) {
              final n = v.length;
              double maxV = 1e-6;
              for (final x in v) {
                if (x > maxV) maxV = x;
              }
              final pts = <Offset>[];
              if (n < 2) {
                pts.add(Offset(0, s.height * 0.65));
                pts.add(Offset(s.width, s.height * 0.65));
              } else {
                for (int i = 0; i < n; i++) {
                  final x = s.width * i / (n - 1);
                  final y = s.height - (v[i] / maxV) * s.height * 0.7 - s.height * 0.12;
                  pts.add(Offset(x, y));
                }
              }
              final path = Path()..moveTo(pts.first.dx, pts.first.dy);
              for (int i = 1; i < pts.length; i++) {
                final mid = Offset((pts[i - 1].dx + pts[i].dx) / 2, (pts[i - 1].dy + pts[i].dy) / 2);
                path.quadraticBezierTo(pts[i - 1].dx, pts[i - 1].dy, mid.dx, mid.dy);
              }
              path.lineTo(pts.last.dx, pts.last.dy);

              final fill = Path.from(path)
                ..lineTo(s.width, s.height)
                ..lineTo(0, s.height)
                ..close();
              canvas.drawPath(
                fill,
                Paint()
                  ..shader = LinearGradient(
                    begin: Alignment.topCenter,
                    end: Alignment.bottomCenter,
                    colors: [color.withOpacity(0.35), color.withOpacity(0.0)],
                  ).createShader(Offset.zero & s),
              );
              canvas.drawPath(
                path,
                Paint()
                  ..color = color
                  ..style = PaintingStyle.stroke
                  ..strokeWidth = 2.2
                  ..strokeCap = StrokeCap.round,
              );
            }

            @override
            bool shouldRepaint(covariant SparkPainter old) => true;
          }


