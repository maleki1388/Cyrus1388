            Widget _cfgTile(Cfg c) {
              final sel = c.link == _selected;
              final ping = _pings[c.link];
              final proto = c.isJson ? 'JSON' : c.link.split('://').first.toUpperCase();
              void select() {
                setState(() {
                  _selected = c.link;
                  _picked = true;
                });
                _save();
                if (_connected && _activeLink != c.link) _switchTo();
              }

              return Directionality(
                textDirection: TextDirection.ltr,
                child: Padding(
                  padding: const EdgeInsets.fromLTRB(12, 4, 12, 4),
                  child: SizedBox(
                    height: 88,
                    child: Row(
                      crossAxisAlignment: CrossAxisAlignment.stretch,
                      children: [
                        GestureDetector(
                          onTap: select,
                          child: Container(
                            width: 52,
                            decoration: BoxDecoration(
                              color: sel ? cAccent : cCardA,
                              borderRadius: BorderRadius.circular(20),
                              boxShadow: sel
                                  ? [BoxShadow(color: cAccent.withOpacity(0.35), blurRadius: 14)]
                                  : const [],
                            ),
                            child: Center(
                              child: RotatedBox(
                                quarterTurns: 3,
                                child: Text(proto,
                                    style: TextStyle(
                                        fontWeight: FontWeight.w700,
                                        fontSize: 15,
                                        color: sel ? Colors.black87 : Colors.white)),
                              ),
                            ),
                          ),
                        ),
                        const SizedBox(width: 6),
                        Expanded(
                          child: GestureDetector(
                            onTap: select,
                            child: Container(
                              padding: const EdgeInsets.fromLTRB(14, 10, 10, 10),
                              decoration: BoxDecoration(
                                color: sel ? cSelected : cCardA,
                                borderRadius: const BorderRadius.horizontal(
                                    left: Radius.circular(20), right: Radius.circular(6)),
                                border: Border.all(color: sel ? cAccent.withOpacity(0.55) : Colors.transparent),
                              ),
                              child: Column(
                                crossAxisAlignment: CrossAxisAlignment.start,
                                mainAxisAlignment: MainAxisAlignment.spaceBetween,
                                children: [
                                  Text(_nameOf(c),
                                      maxLines: 1,
                                      overflow: TextOverflow.ellipsis,
                                      style: TextStyle(fontSize: 15)),
                                  Row(
                                    children: [
                                      Expanded(
                                        child: Text(_hostOf(c),
                                            maxLines: 1,
                                            overflow: TextOverflow.ellipsis,
                                            style: TextStyle(
