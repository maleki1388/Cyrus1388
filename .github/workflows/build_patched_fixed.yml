                    child: Column(mainAxisSize: MainAxisSize.min, children: [
                      Icon(icons[i], size: 22, color: sel ? cAccent : cIdle),
                      const SizedBox(height: 5),
                      Text(labels[i], style: TextStyle(fontSize: 12, color: sel ? cAccent : cIdle, fontWeight: sel ? FontWeight.w600 : FontWeight.normal)),
                    ]),
                  ),
                ),
